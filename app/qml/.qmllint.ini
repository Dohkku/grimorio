[General]
# `tema`, `modelo`, `banco` y `app` los inyecta C++ como propiedades de
# contexto, y los ids exteriores se usan a propósito desde el delegado.
# qmllint no puede saberlo, así que ese aviso concreto se apaga; todos los
# demás siguen siendo errores que rompen la compilación.
DisableDefaultImports=false
[Warnings]
UnqualifiedAccess=disable
